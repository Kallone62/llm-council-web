name: UI09 Sonar diagnosis (read-only)
on:
  push:
    branches: [diagnostic/ui09-sonar]
    paths: [.github/workflows/diagnose-ui09-sonar.yml]
permissions:
  checks: read
  contents: read
jobs:
  annotations:
    runs-on: ubuntu-24.04
    steps:
      - name: Read exact head check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: "cdcdf77291ad92318c4bbbbae6c0798a829e2646"
        run: |
          set -euo pipefail
          gh api "repos/Kallone62/llm-council-web/commits/$TARGET_SHA/check-runs" --jq '.check_runs[] | {id,name,status,conclusion,head_sha,details_url}'
          for id in $(gh api "repos/Kallone62/llm-council-web/commits/$TARGET_SHA/check-runs" --jq '.check_runs[] | select(.name | test("sonar"; "i")) | .id'); do
            gh api "repos/Kallone62/llm-council-web/check-runs/$id/annotations" --paginate --jq '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
          done
