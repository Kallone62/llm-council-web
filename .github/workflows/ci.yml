name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Keep the runner on a distribution supported by the pinned Playwright.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Verify exact patched native engine package
        run: .venv/bin/python -c "from importlib.metadata import version; import llm_council; assert version('llm-council-core') == llm_council.__version__ == '0.53.0+eng31.1'"

      - name: Run backend unit and regression tests
        run: .venv/bin/python -m pytest -q --ignore=tests/test_controlled_engine.py --ignore=tests/test_controlled_memory.py --ignore=tests/test_controlled_concurrency.py --ignore=tests/test_controlled_profiles.py --ignore=tests/test_controlled_verdict.py --ignore=tests/test_controlled_synthesis_mode.py --ignore=tests/test_controlled_normalization.py --ignore=tests/test_controlled_self_votes.py --ignore=tests/test_controlled_gateway_fallback.py --ignore=tests/test_gateway_policy_edges.py --ignore=tests/test_controlled_gateway_app_edges.py --ignore=tests/test_controlled_quality.py --ignore=tests/test_controlled_quality_semantics.py --ignore=tests/test_controlled_rubric.py --ignore=tests/test_controlled_rubric_schema.py --ignore=tests/test_controlled_holistic_json.py --ignore=tests/test_controlled_ballot_semantics.py --ignore=tests/test_controlled_safety.py --ignore=tests/test_controlled_bias.py --ignore=tests/test_controlled_usage.py --ignore=tests/test_controlled_free_endpoint.py --ignore=tests/test_controlled_free_catalog.py --ignore=tests/test_controlled_tier_scope.py

      - name: Run controlled native engine acceptance (ENG-01)
        run: .venv/bin/python -m pytest -q tests/test_controlled_engine.py tests/test_controlled_memory.py tests/test_controlled_concurrency.py tests/test_controlled_profiles.py tests/test_controlled_verdict.py tests/test_controlled_synthesis_mode.py tests/test_controlled_normalization.py tests/test_controlled_self_votes.py tests/test_controlled_gateway_fallback.py tests/test_gateway_policy_edges.py tests/test_controlled_gateway_app_edges.py tests/test_controlled_quality.py tests/test_controlled_quality_semantics.py tests/test_controlled_rubric.py tests/test_controlled_rubric_schema.py tests/test_controlled_holistic_json.py tests/test_controlled_ballot_semantics.py tests/test_controlled_safety.py tests/test_controlled_bias.py tests/test_controlled_usage.py tests/test_controlled_free_endpoint.py tests/test_controlled_free_catalog.py tests/test_controlled_tier_scope.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Test peer-review rendering
        working-directory: frontend
        run: node --test tests/stage2-status.test.mjs

      - name: Test SSE stream contract
        working-directory: frontend
        run: node --test tests/sse-contract.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install locked browser test wheels
        run: uv pip install --python .venv/bin/python --no-build --require-hashes -r tests/browser/requirements-linux.txt

      - name: Install Chromium for browser acceptance
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Build desktop frontend for browser acceptance
        working-directory: frontend
        env:
          LLM_COUNCIL_DESKTOP_BUILD: "1"
        run: npm run build

      - name: Run real browser acceptance (UI-01)
        run: .venv/bin/python tests/browser/ui01.py

      - name: Verify UI-01 detects missing sidebar and persistence
        run: .venv/bin/python tests/browser/mutations.py

      - name: Run real browser acceptance (UI-02)
        run: .venv/bin/python tests/browser/ui02.py

      - name: Verify UI-02 detects key persistence, privacy and sidebar regressions
        run: .venv/bin/python tests/browser/mutations_ui02.py

      - name: Run real browser acceptance (UI-03)
        run: .venv/bin/python tests/browser/ui03.py

      - name: Verify UI-03 detects profile persistence, effective reload and Free notice regressions
        run: .venv/bin/python tests/browser/mutations_ui03.py

      - name: Run real browser acceptance (UI-04)
        run: .venv/bin/python tests/browser/ui04.py

      - name: Verify UI-04 detects live progress, persistence, loading and final answer regressions
        run: .venv/bin/python tests/browser/mutations_ui04.py

      - name: Run real browser acceptance (UI-05)
        run: .venv/bin/python tests/browser/ui05.py

      - name: Verify UI-05 detects model tab and response association regressions
        run: .venv/bin/python tests/browser/mutations_ui05.py

      - name: Run real browser acceptance (UI-06)
        run: .venv/bin/python tests/browser/ui06.py

      - name: Verify UI-06 detects peer review and aggregate ranking regressions
        run: .venv/bin/python tests/browser/mutations_ui06.py

      - name: Run real browser acceptance (UI-07)
        run: .venv/bin/python tests/browser/ui07.py

      - name: Verify UI-07 detects Chairman result and warning regressions
        run: .venv/bin/python tests/browser/mutations_ui07.py

      - name: Run real browser acceptance (UI-08)
        run: .venv/bin/python tests/browser/ui08.py

      - name: Verify UI-08 detects missing, foreign, failed and rewritten history
        run: .venv/bin/python tests/browser/mutations_ui08.py

      - name: Run real browser acceptance (UI-09)
        run: .venv/bin/python tests/browser/ui09.py

      - name: Verify UI-09 detects hidden errors, stuck loading, false final and rejected writes
        run: .venv/bin/python tests/browser/mutations_ui09.py

      - name: Run real browser acceptance (UI-10)
        run: .venv/bin/python tests/browser/ui10.py

      - name: Verify UI-10 detects missing complete, premature final, stuck loading and false reload
        run: .venv/bin/python tests/browser/mutations_ui10.py

      - name: Run real browser acceptance (UI-11)
        run: .venv/bin/python tests/browser/ui11.py

      - name: Verify UI-11 detects lost history, corrupt neighbour deletion and wrong reload presentation
        run: .venv/bin/python tests/browser/mutations_ui11.py

      - name: Run real browser acceptance (UI-12)
        timeout-minutes: 3
        run: .venv/bin/python tests/browser/ui12.py

      - name: Verify UI-12 detects deletion, confirmation and retained-data regressions
        run: .venv/bin/python tests/browser/mutations_ui12.py

      - name: Attach UI-12 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-12-browser-evidence
          path: browser-artifacts/ui12/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-11 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-11-browser-evidence
          path: browser-artifacts/ui11/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-10 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-10-browser-evidence
          path: browser-artifacts/ui10/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-09 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-09-browser-evidence
          path: browser-artifacts/ui09/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-08 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-08-browser-evidence
          path: browser-artifacts/ui08/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-07 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-07-browser-evidence
          path: browser-artifacts/ui07/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-06 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-06-browser-evidence
          path: browser-artifacts/ui06/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-05 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-05-browser-evidence
          path: browser-artifacts/ui05/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-04 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-04-browser-evidence
          path: browser-artifacts/ui04/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-03 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-03-browser-evidence
          path: browser-artifacts/ui03/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach UI-02 sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-02-browser-evidence
          path: browser-artifacts/ui02/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-01-browser-evidence
          path: |
            browser-artifacts/
            !browser-artifacts/ui02/
            !browser-artifacts/ui03/
            !browser-artifacts/ui04/
            !browser-artifacts/ui05/
            !browser-artifacts/ui06/
            !browser-artifacts/ui07/
            !browser-artifacts/ui08/
            !browser-artifacts/ui09/
            !browser-artifacts/ui10/
            !browser-artifacts/ui11/
            !browser-artifacts/ui12/
          if-no-files-found: ignore
          retention-days: 7
