name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Verify exact patched native engine package
        run: .venv/bin/python -c "from importlib.metadata import version; import llm_council; assert version('llm-council-core') == llm_council.__version__ == '0.53.0+eng18.1'"

      - name: Run backend unit and regression tests
        run: .venv/bin/python -m pytest -q --ignore=tests/test_controlled_engine.py --ignore=tests/test_controlled_memory.py --ignore=tests/test_controlled_concurrency.py --ignore=tests/test_controlled_profiles.py --ignore=tests/test_controlled_verdict.py --ignore=tests/test_controlled_synthesis_mode.py --ignore=tests/test_controlled_normalization.py --ignore=tests/test_controlled_self_votes.py --ignore=tests/test_controlled_gateway_fallback.py --ignore=tests/test_gateway_policy_edges.py --ignore=tests/test_controlled_gateway_app_edges.py --ignore=tests/test_controlled_quality.py

      - name: Run controlled native engine acceptance (ENG-01)
        run: .venv/bin/python -m pytest -q tests/test_controlled_engine.py tests/test_controlled_memory.py tests/test_controlled_concurrency.py tests/test_controlled_profiles.py tests/test_controlled_verdict.py tests/test_controlled_synthesis_mode.py tests/test_controlled_normalization.py tests/test_controlled_self_votes.py tests/test_controlled_gateway_fallback.py tests/test_gateway_policy_edges.py tests/test_controlled_gateway_app_edges.py tests/test_controlled_quality.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Test peer-review rendering
        working-directory: frontend
        run: node --test tests/stage2-status.test.mjs

      - name: Test SSE stream contract
        working-directory: frontend
        run: node --test tests/sse-contract.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build
