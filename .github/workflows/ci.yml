name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run backend unit and regression tests
        run: uv run python -m pytest -q --ignore=tests/test_controlled_engine.py --ignore=tests/test_controlled_memory.py

      - name: Run controlled native engine acceptance (ENG-01)
        run: uv run python -m pytest -q tests/test_controlled_engine.py tests/test_controlled_memory.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Test peer-review rendering
        working-directory: frontend
        run: node --test tests/stage2-status.test.mjs

      - name: Test SSE stream contract
        working-directory: frontend
        run: node --test tests/sse-contract.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build
