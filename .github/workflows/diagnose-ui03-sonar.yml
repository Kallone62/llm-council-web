name: UI03 Sonar diagnosis (read-only)
on:
  push:
    branches: [diagnostic/ui03-sonar]
    paths: [.github/workflows/diagnose-ui03-sonar.yml]
permissions:
  checks: read
  contents: read
jobs:
  annotations:
    runs-on: ubuntu-24.04
    steps:
      - name: Read exact check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Kallone62/llm-council-web/check-runs/139080719614/annotations --jq '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
