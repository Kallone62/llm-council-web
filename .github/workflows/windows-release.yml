name: Windows desktop beta

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - desktop_launcher.py
      - backend/**
      - frontend/**
      - scripts/install.ps1
      - .github/workflows/windows-release.yml
      - llm_council.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production React frontend
        shell: pwsh
        working-directory: frontend
        env:
          LLM_COUNCIL_DESKTOP_BUILD: '1'
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite build failed' }
          if (-not (Test-Path 'dist/index.html')) { throw 'No frontend build output' }

      - name: Install pinned engine and PyInstaller
        shell: pwsh
        run: |
          uv sync
          if ($LASTEXITCODE -ne 0) { throw 'uv sync failed' }
          uv pip install --python .venv/Scripts/python.exe pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller install failed' }

      - name: Build Windows desktop EXE with native engine
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m PyInstaller --noconfirm --clean --onedir --name LLMCouncilWeb --collect-all llm_council --copy-metadata llm-council-core --add-data "frontend/dist;frontend/dist" desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          Copy-Item llm_council.yaml dist/LLMCouncilWeb/llm_council.yaml
          Copy-Item .env.example dist/LLMCouncilWeb/.env.example

      - name: Smoke-test bundled app without OpenRouter requests
        shell: pwsh
        env:
          LLM_COUNCIL_NO_BROWSER: '1'
        run: |
          $appFolder = (Resolve-Path "dist/LLMCouncilWeb").Path
          $exe = Join-Path $appFolder "LLMCouncilWeb.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "council-desktop-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "council-desktop-stderr.log"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $appFolder -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              if ($proc.HasExited) { break }
              try {
                $ui = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:8001/app/' -TimeoutSec 2
                $api = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:8001/api/settings' -TimeoutSec 2
                if ($ui.StatusCode -eq 200 -and $ui.Content -match 'assets/' -and $api.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              Write-Host '---- APP STDOUT ----'
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              Write-Host '---- APP STDERR ----'
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              throw 'Desktop EXE did not serve the compiled React UI and Settings API'
            }
            Write-Host 'Desktop EXE smoke test passed'
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package release ZIP and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package -Force | Out-Null
          Copy-Item -Path dist/LLMCouncilWeb -Destination release-package/LLMCouncilWeb -Recurse
          Copy-Item README.md release-package/LLMCouncilWeb/README.md
          Copy-Item NOTICE.md release-package/LLMCouncilWeb/NOTICE.md
          $zip = "LLMCouncilWeb-Windows-x64.zip"
          Compress-Archive -Path release-package/LLMCouncilWeb -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$sha  $zip" -Encoding ascii
          Write-Host "Release ZIP: $((Get-Item $zip).Length) bytes"
          Write-Host "SHA256: $sha"

      - name: Attach Windows beta package to workflow
        uses: actions/upload-artifact@v4
        with:
          name: LLMCouncilWeb-Windows-x64
          path: |
            LLMCouncilWeb-Windows-x64.zip
            LLMCouncilWeb-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish v1.1.0-beta.1 GitHub prerelease when explicitly dispatched
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v1.1.0-beta.1'
          gh release create $tag "LLMCouncilWeb-Windows-x64.zip" "LLMCouncilWeb-Windows-x64.zip.sha256" --target $env:GITHUB_SHA --title "LLM Council Web v1.1.0 Beta 1 (Windows)" --prerelease --notes "Unofficial community integration of the Karpathy frontend with llm-council-core 0.53.0. Download the Windows ZIP, extract it, then run LLMCouncilWeb.exe. No Python, Node, Git or uv required. It opens http://localhost:8001/app/ and stores API keys and conversations locally beside the executable. For an automated installation, use the pinned PowerShell installer in scripts/install.ps1. Windows SmartScreen may warn about this currently unsigned beta. OpenRouter model calls can incur separate costs. Refer to NOTICE.md for attribution and third-party licensing concerns. This is a beta: full real-provider compatibility requires further user testing."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
