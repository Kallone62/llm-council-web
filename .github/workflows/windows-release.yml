name: Windows desktop beta

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - desktop_launcher.py
      - backend/**
      - frontend/**
      - scripts/install.ps1
      - .github/workflows/windows-release.yml
      - llm_council.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate one-command PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1').Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Installer PowerShell syntax is invalid'
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production React frontend and rasterize original SVG
        shell: pwsh
        working-directory: frontend
        env:
          LLM_COUNCIL_DESKTOP_BUILD: '1'
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm install --no-save --no-package-lock sharp@0.34.4
          if ($LASTEXITCODE -ne 0) { throw 'Sharp install failed' }
          node scripts/render-icons.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SVG icon rendering failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite build failed' }
          if (-not (Test-Path 'dist/index.html')) { throw 'No frontend build output' }

      - name: Install pinned engine and PyInstaller
        shell: pwsh
        run: |
          uv sync
          if ($LASTEXITCODE -ne 0) { throw 'uv sync failed' }
          uv pip install --python .venv/Scripts/python.exe pyinstaller==6.16.0 pystray==0.19.5 pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller install failed' }

      - name: Build Windows desktop EXE with native engine and original logo
        shell: pwsh
        run: |
          .venv/Scripts/python.exe scripts/build_desktop_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows ICO generation failed' }
          .venv/Scripts/python.exe -m PyInstaller --noconfirm --clean --onedir --windowed --name LLMCouncilWeb --icon "build/brand/LLMCouncilWeb.ico" --collect-all llm_council --collect-all pystray --copy-metadata llm-council-core --add-data "frontend/dist;frontend/dist" --add-data "build/brand/icon-64.png;brand" desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          Copy-Item llm_council.yaml dist/LLMCouncilWeb/llm_council.yaml
          Copy-Item .env.example dist/LLMCouncilWeb/.env.example

      - name: Assert EXE is a Windows GUI application (no console)
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/LLMCouncilWeb/LLMCouncilWeb.exe').Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem" }
          Write-Host "Windows GUI subsystem verified: no CMD window"
          if (-not (Test-Path 'build/brand/LLMCouncilWeb.ico')) { throw 'EXE icon missing' }
          if (-not (Test-Path 'dist/LLMCouncilWeb/_internal/brand/icon-64.png')) { throw 'Tray icon missing from bundled EXE' }
          if (-not (Test-Path 'dist/LLMCouncilWeb/_internal/frontend/dist/llm-council.svg')) { throw 'Frontend favicon SVG missing from bundled EXE' }

      - name: Smoke-test bundled app without OpenRouter requests
        shell: pwsh
        env:
          LLM_COUNCIL_NO_BROWSER: '1'
          LLM_COUNCIL_NO_TRAY: '1'
        run: |
          $appFolder = (Resolve-Path "dist/LLMCouncilWeb").Path
          $exe = Join-Path $appFolder "LLMCouncilWeb.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "council-desktop-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "council-desktop-stderr.log"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $appFolder -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $uiReady = $false
            $apiReady = $false
            $lastError = ''
            for ($i = 0; $i -lt 18; $i++) {
              if ($proc.HasExited) { break }
              if (-not $uiReady) {
                try {
                  $ui = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8001/app/' -TimeoutSec 8
                  $uiReady = $ui.StatusCode -eq 200
                } catch { $lastError = $_.Exception.Message }
              }
              if (-not $apiReady) {
                try {
                  $api = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8001/api/settings' -TimeoutSec 8
                  $apiReady = $api.StatusCode -eq 200
                  if ($apiReady) {
                    $effective = $api.Content | ConvertFrom-Json
                    if ($effective.profile -ne 'free') { throw "New-install preset must be Free, got $($effective.profile)" }
                    if ($effective.api_key_configured) { throw 'Bundled beta must not contain any API key' }
                  }
                } catch { $lastError = $_.Exception.Message }
              }
              if ($uiReady -and $apiReady) { break }
              Start-Sleep -Milliseconds 500
            }
            $iconReady = $false
            if ($uiReady) {
              try {
                $icon = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8001/app/llm-council.svg' -TimeoutSec 8
                $iconReady = $icon.StatusCode -eq 200 -and $icon.Content.Contains('<svg')
              } catch { $lastError = $_.Exception.Message }
            }
            $ready = $uiReady -and $apiReady -and $iconReady
            if (-not $ready) {
              Write-Host "Last HTTP error: $lastError"
              Write-Host '---- APP STDOUT ----'
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              Write-Host '---- APP STDERR ----'
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              Write-Host '---- GUI APP LOG ----'
              $logs = Join-Path $env:LOCALAPPDATA 'LLMCouncilWeb/logs'
              if (Test-Path $logs) {
                Get-ChildItem $logs -Filter '*.log' | Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1 | ForEach-Object { Get-Content $_.FullName -Tail 100 }
              }
              throw 'Desktop EXE did not serve the compiled React UI and Settings API'
            }
            Write-Host 'Desktop EXE smoke test passed'
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package release ZIP and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package -Force | Out-Null
          Copy-Item -Path dist/LLMCouncilWeb -Destination release-package/LLMCouncilWeb -Recurse
          Copy-Item README.md release-package/LLMCouncilWeb/README.md
          Copy-Item NOTICE.md release-package/LLMCouncilWeb/NOTICE.md
          $zip = "LLMCouncilWeb-Windows-x64.zip"
          Compress-Archive -Path release-package/LLMCouncilWeb -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$sha  $zip" -Encoding ascii
          Write-Host "Release ZIP: $((Get-Item $zip).Length) bytes"
          Write-Host "SHA256: $sha"

      - name: Attach Windows beta package to workflow
        uses: actions/upload-artifact@v4
        with:
          name: LLMCouncilWeb-Windows-x64
          path: |
            LLMCouncilWeb-Windows-x64.zip
            LLMCouncilWeb-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish v1.1.0-beta.1 GitHub prerelease when explicitly requested
        if: |
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'workflow_dispatch' ||
            (
              github.event_name == 'push' &&
              contains(github.event.head_commit.message, '[publish-beta-v1.1.0-beta.1]')
            )
          )
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v1.1.0-beta.1'
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to replace assets silently."
          }
          gh release create $tag "LLMCouncilWeb-Windows-x64.zip" "LLMCouncilWeb-Windows-x64.zip.sha256" --target $env:GITHUB_SHA --title "LLM Council Web v1.1.0 Beta 1 (Windows)" --prerelease --notes-file RELEASE_NOTES_v1.1.0-beta.1.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
