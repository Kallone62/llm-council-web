name: UI-01 annotation diagnosis
on:
  push:
    branches: [diagnostic/ui01-sonar-annotations]
permissions:
  checks: read
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    steps:
      - name: Read existing quality check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Kallone62/llm-council-web/check-runs/138922023688/annotations --jq '.[] | {path,start_line,end_line,title,message}'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve exact browser wheels
        run: |
          python -m pip download --only-binary=:all: --dest /tmp/ui01-wheels playwright==1.57.0 pyee==13.0.1 greenlet==3.5.6 typing-extensions==4.16.0
          sha256sum /tmp/ui01-wheels/*.whl
