name: UI08 memory Sonar diagnosis (read-only)
on:
  push:
    branches: [diagnostic/ui08-memory-sonar]
    paths: [.github/workflows/diagnose-ui08-memory-sonar.yml]
permissions:
  checks: read
  contents: read
jobs:
  annotations:
    runs-on: ubuntu-24.04
    steps:
      - name: Read exact head check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: "17926c40aaf241407201a1960f4e3c6ce4c7c027"
        run: |
          set -euo pipefail
          gh api "repos/Kallone62/llm-council-web/commits/$TARGET_SHA/check-runs" --jq '.check_runs[] | {id,name,status,conclusion,head_sha,details_url}'
          gh api "repos/Kallone62/llm-council-web/check-runs/140608576304/annotations" --paginate --jq '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
